<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Everest Point View</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
    background:#000;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* CONTENEDOR */
.contenedor{
    position:relative;
    text-align:center;
}

/* IMAGEN */
.imagen{
    width:100%;
    max-width:1200px;
}

/* BOTON */
.boton-return{
    position:absolute;
    bottom:20px;
    left:20px;

    background:#000;
    color:#fff;

    padding:14px 35px;

    text-decoration:none;

    font-size:18px;
    font-weight:bold;

    border-radius:8px;

    transition:0.3s;
}

.boton-return:hover{
    background:#d4a017;
    color:#000;
}

/* CELULAR */
@media(max-width:768px){

    .imagen{

        width:80%;
        height:50vh;

        object-fit:contain;
    }

    .boton-return{

        left:50%;
        transform:translateX(-50%);

        bottom:10px;

        font-size:16px;

        padding:12px 28px;
    }

}

</style>
</head>

<body>

<div class="contenedor">

    <!-- IMAGEN -->
    <img src="lukla.jpeg" class="imagen">

    <!-- BOTON -->
    <a href="trekkingMenu.html" class="boton-return">
        RETURN
    </a>

</div>

</body>
</html>
