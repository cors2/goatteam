<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Goat Team</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Video de fondo */
        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* Capa oscura para que el texto se vea mejor */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 20px;
        }

        .content {
            max-width: 600px;
        }

        h1 {
            font-size: 3em;
        }

        p {
            font-size: 1.2em;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            p {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline>
        <source src="video.mp4" type="video/mp4">
        Tu navegador no soporta video HTML5.
    </video>

    <div class="overlay">
        <div class="content">
            <br><br><br><br><br><br><br>
            <br><br><br><br><br><br><br>
            <br><br><br><br><br><br><br>
            <br><br><br><br><br><br>
            <h1>Bienvenido</h1>
            <p>Estamos trabajando para mejorar tu experiencia.
Nuestro sitio se encuentra temporalmente en mantenimiento</p>
            <br>
            <h1>Welcome to our website</h1>
            <p>We are working to enhance your experience.
Our website is currently under maintenance.</p>
        </div>
    </div>

</body>
</html>
