<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAT TEAM</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    overflow-x:hidden;
}

/* CONTENEDOR PRINCIPAL */

.hero{
    width:100%;
    height:100vh;
    background-image:url('portada.png'); /* CAMBIA AQUI TU IMAGEN */
    background-size:cover;
    background-position:center;
    position:relative;
}

/* CAPA OSCURA */

.hero::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.15);
}

/* BANDERAS */

.flags{
    width:100%;
    background:rgba(255,255,255,0.15);
    padding:5px 10px;
    position:relative;
    z-index:2;
    display:flex;
    gap:8px;
    align-items:center;
    overflow-x:auto;
}

.flags img{
    width:35px;
    height:18px;
    object-fit:cover;
    border:1px solid #fff;
    vertical-align:middle;
}

/* HEADER */

.header{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:20px 50px;
    position:relative;
    z-index:2;
}

/* LOGO */

.logo h1{
    color:white;
    font-size:55px;
    font-weight:bold;
    line-height:1;
}

.logo p{
    color:white;
    font-size:18px;
    letter-spacing:1px;
}

/* MENU */

.menu{
    display:flex;
    gap:40px;
    margin-top:15px;
}

.menu a{
    text-decoration:none;
    color:yellow;
    font-size:28px;
    font-weight:bold;
    transition:0.3s;
}

.menu a:hover{
    color:white;
    transform:scale(1.1);
}

/* RESPONSIVE */

@media(max-width:900px){

    .header{
        flex-direction:column;
        align-items:center;
        text-align:center;
        gap:20px;
    }

    .menu{
        flex-wrap:wrap;
        justify-content:center;
        gap:20px;
    }

    .menu a{
        font-size:22px;
    }

    .logo h1{
        font-size:40px;
    }
}

</style>
</head>

<body>
