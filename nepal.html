<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Everest Point View</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

/* CONTENEDOR PRINCIPAL */
.fondo{
    width:100%;
    height:100vh;

    /* CAMBIA EL NOMBRE POR TU IMAGEN */
    background-image:url('nepal.jpeg');

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    position:relative;
}

/* BOTON RETURN */
.boton-return{
    position:absolute;
    bottom:40px;
    left:40px;

    background:#000;
    color:#fff;

    padding:14px 35px;

    text-decoration:none;

    font-size:18px;
    font-weight:bold;

    border-radius:8px;

    transition:0.3s;
}

.boton-return:hover{
    background:#d4a017;
    color:#000;
}

</style>
</head>

<body>

<div class="fondo">

    <!-- BOTON LINK -->
    <a href="trekkingMenu.html" class="boton-return">
        RETURN
    </a>

</div>

</body>
</html>
