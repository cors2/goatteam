<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Everest Point View</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
    background:#000;
}

/* =========================
   VERSION PC
========================= */

.fondo{
    width:100%;
    height:100vh;

    background-image:url('nepal.jpeg');

    background-size:contain;
    background-position:center;
    background-repeat:no-repeat;

    background-color:#000;

    position:relative;
}

/* IMAGEN SOLO CELULAR */
.imagen-mobile{
    display:none;
}

/* BOTON */
.boton-return{
    position:absolute;
    bottom:40px;
    left:40px;

    background:#000;
    color:#fff;

    padding:14px 35px;

    text-decoration:none;

    font-size:18px;
    font-weight:bold;

    border-radius:8px;

    transition:0.3s;
}

.boton-return:hover{
    background:#d4a017;
    color:#000;
}

/* =========================
   CELULAR
========================= */

@media(max-width:768px){

    /* QUITA EL FONDO */
    .fondo{
    background:none;
    height:auto;

    display:flex;
    justify-content:center;
    align-items:center;

    padding-top:20px;
    padding-bottom:120px;
}

    /* MUESTRA IMAGEN */
    .imagen-mobile{
        display:block;

        width:90%;
        height:60vh;

    object-fit:fill;
    }

    /* BOTON */
.boton-return{

    left:50%;
    transform:translateX(-50%);

    bottom:-80px;

    font-size:16px;

    padding:12px 28px;
}

}

</style>
</head>

<body>

<div class="fondo">

    <!-- IMAGEN SOLO EN CELULAR -->
    <img src="nepal.jpeg" class="imagen-mobile">

    <!-- BOTON -->
    <a href="trekkingMenu.html" class="boton-return">
        RETURN
    </a>

</div>

</body>
</html>
